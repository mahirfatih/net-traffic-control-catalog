name: release

# A tag publishes the catalog as a GitHub Release: the exact bytes an application
# can pin to, plus the manifest and checksum that prove them. Nothing here
# compresses the file — it ships as the plain JSON the app and any other reader
# fetches from the raw URL.
#
# `workflow_dispatch` rehearses all of it without publishing. A tag is immutable,
# so the only way to find out that this workflow is broken is to have already
# shipped it; the manual run exists so a maintainer can watch the whole path —
# checks, restore, manifest, notes — against a real tag name and only then push
# the tag for real. It runs against `main`, so it rehearses today's bytes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to rehearse (used in the notes; nothing is published)"
        required: false
        default: "v0.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A dispatch is a rehearsal: run every step, then stop before the publish.
    env:
      REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # seeds-provenance.py reads the first commit that wrote
          # seeds/categories.json, so a shallow clone cannot reproduce it.
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the checks
        run: ./test/test.sh
      # The suite rebuilds catalog.json, and the rebuild re-stamps `generated`
      # with the runner's date. Step 3b proves the content is identical apart
      # from that stamp, so restore the tagged bytes: the release ships what was
      # tagged, not what today's clock says. In a rehearsal there is no tag, so
      # HEAD is the commit being rehearsed — the same guarantee, one commit up.
      - name: Restore the tagged catalog
        run: git checkout HEAD -- catalog.json
      - name: Verify the manifest describes them
        run: |
          python3 scripts/release/build-manifest.py --check
          python3 scripts/release/build-manifest.py --sha256-out catalog.json.sha256
      - name: Write the release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - > notes.md <<'PY'
          import json, os
          tag = os.environ["TAG"]
          m = json.load(open("manifest.json"))
          print(f"""## Catalog {tag}

          | | |
          | :--- | :--- |
          | Format version | {m['format_version']} |
          | Generated | {m['generated']} |
          | Hosts | {m['hosts']} |
          | Services | {m['services']} |
          | Size | {m['bytes']} bytes |
          | SHA-256 | `{m['sha256']}` |

          Pinned source:

          ```
          https://raw.githubusercontent.com/mahirfatih/net-traffic-control-catalog/{tag}/catalog.json
          ```

          Verify with `sha256sum -c catalog.json.sha256`. How to consume it is in
          `docs/reference/INTEGRATION.md`; what changed is in `CHANGELOG.md`.
          """)
          PY
      # A rehearsal stops here and shows what would have shipped, so the notes
      # and the checksum can be read before any of it is permanent.
      - name: Rehearse the release
        if: env.REHEARSAL == '1'
        run: |
          echo "::notice::rehearsal only — nothing was published"
          echo
          cat notes.md
          echo
          echo "=== assets that would be attached ==="
          ls -l catalog.json manifest.json catalog.json.sha256
          echo
          cat catalog.json.sha256
      - name: Publish the release
        if: env.REHEARSAL == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            catalog.json \
            manifest.json \
            catalog.json.sha256 \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md